name: Hello World Action

# Controls when the workflow will run (Triggers on every code push)
on: [push]

jobs:
  say-hello:   #job name
    # The type of virtual machine runner the job will run on
    runs-on: ubuntu-latest #github hosted runners

    steps:
      # Step 1: Checks out your repository code so the runner can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Runs a single standard shell command
      - name: Run Hello World
        run: echo "Hello, World! I am running from GitHub Actions."
