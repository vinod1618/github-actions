name: conditions demo
# Controls when the workflow will run (Triggers on every code push)
on: [push]

jobs:
  say-hello:   #job name
    # The type of virtual machine runner the job will run on
    runs-on: ubuntu-latest #github hosted runners

    steps:
      # Step 2: Runs a single standard shell command
      - name: main branch
        if: github.ref_name == "main"
        run: echo "This one executes if branch is main"

      - name: feature-branch
        if: github.ref_name == "feature-*"
        run: echo "This one executes if branch is feature branch"
